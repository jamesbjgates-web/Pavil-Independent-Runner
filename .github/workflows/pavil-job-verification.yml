name: Pavil Job Verification Gate

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Controller job ID (non-secret)"
        required: true
        type: string
      execution_id:
        description: "Dell execution ID (non-secret)"
        required: true
        type: string
      manifest_sha256:
        description: "Approved manifest pin"
        required: true
        type: string
      suite_sha256:
        description: "Approved suite pin"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pavil-job-gate-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JOB_ID: ${{ inputs.job_id }}
      EXECUTION_ID: ${{ inputs.execution_id }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      SUITE_SHA256: ${{ inputs.suite_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable dispatch metadata
        run: |
          python3 -I -c 'import os,sys;sys.path.insert(0,os.getcwd());from dispatch_contract import validate_dispatch;validate_dispatch(os.environ["JOB_ID"],os.environ["EXECUTION_ID"],os.environ["MANIFEST_SHA256"],os.environ["SUITE_SHA256"])'
      - name: Retrieve pinned Dell result and approved suite
        env:
          PAVIL_DELIVERY_SECRET: ${{ secrets.PAVIL_DELIVERY_SECRET }}
        run: |
          python3 -I - <<'PY'
          import os, sys, hashlib
          sys.path.insert(0, os.getcwd())
          from independent_delivery import retrieve_approved_pair
          from report_coverage import approved_names
          key = os.environ.get("PAVIL_DELIVERY_SECRET", "").encode()
          if len(key) < 32:
              raise SystemExit("INDEPENDENT_DELIVERY_SECRET_NOT_CONFIGURED")
          pair = retrieve_approved_pair(os.environ["JOB_ID"], os.environ["EXECUTION_ID"],
                                       os.environ["SUITE_SHA256"], key)
          print("PINNED_DELIVERY_OK", "artifact_sha256=" + pair["artifact_sha256"])
          try:
              names = approved_names(pair["suite"])
          except (ValueError, TypeError) as exc:
              raise SystemExit("APPROVED_SUITE_NOT_EXECUTABLE_CONTRACT: " + str(exc))
          print("APPROVED_TEST_CASES", len(names))
          raise SystemExit("INDEPENDENT_EXECUTOR_NOT_COMMISSIONED: no tests run, no attestation")
          PY
